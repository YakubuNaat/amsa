# Conda environment for AMSA.
# Create with:  conda env create -f environment.yml
# Activate with: conda activate amsa
#
# Rationale: numpy/scipy/ase/pymatgen are installed as prebuilt conda-forge
# binaries (no C/C++ compiler needed at all -- avoids the scipy build error).
# Groq/LangGraph/LangChain have no conda-forge builds, so they're installed
# via pip AFTER the conda env is created, using the pip already inside it.

name: amsa
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - ase>=3.23
  - pymatgen>=2024.5.1
  - pyyaml>=6.0
  - jinja2>=3.1
  - requests>=2.31
  - pytest>=8.0
  - pip
  - pip:
      - pydantic>=2.6
      - python-dotenv>=1.0
      - groq>=0.11.0
      - langgraph>=0.2.0
      - langchain-core>=0.3.0
